<div class="container-professor form-page">
  <div class="form-container">
    <h2>Cadastro de Professor</h2>

    <form [formGroup]="formularioProfessor" (ngSubmit)="enviarFormulario()">

      <div class="form-group">
        <label for="nome">Nome:</label>
        <input 
          id="nome" 
          type="text" 
          formControlName="nome" 
          placeholder="Digite o nome" 
          required>
      </div>

      <div class="form-group">
        <label for="email">E-mail:</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="Digite o e-mail" 
          required>
      </div>

      <div class="form-group">
        <button type="submit" [disabled]="formularioProfessor.invalid">
          Cadastrar
        </button>
      </div>

    </form>

    <div class="mensagens">
      <p class="sucesso" *ngIf="mensagemSucesso">{{ mensagemSucesso }}</p>
      <p class="erro" *ngIf="mensagemErro">{{ mensagemErro }}</p>
    </div>
  </div>
</div>
