<div class="container-aluno form-page">
  <div class="form-container">
    <h2>Cadastro de Aluno</h2>

    <form [formGroup]="alunoForm" (ngSubmit)="enviarFormulario()">

      <div class="form-group">
        <label for="matricula">Matrícula:</label>
        <input id="matricula" type="text" formControlName="matricula" placeholder="Digite a matrícula" required>
      </div>

      <div class="form-group">
        <label for="nome">Nome:</label>
        <input id="nome" type="text" formControlName="nome" placeholder="Digite o nome" required>
      </div>

      <div class="form-group">
        <label for="email">E-mail:</label>
        <input id="email" type="email" formControlName="email" placeholder="Digite o e-mail" required>
      </div>

      <div class="form-group">
        <label for="dataNascimento">Data de Nascimento:</label>
        <input id="dataNascimento" type="date" formControlName="dataNascimento" required>
      </div>

      <div class="form-group">
        <label for="curso">Curso:</label>
        <select id="curso" formControlName="cursoId" required>
          <option value="" disabled selected>Selecione o curso</option>
          <option *ngFor="let c of cursos" [value]="c.id">{{ c.nome }}</option>
        </select>
      </div>

      <div class="form-group">
        <button type="submit" [disabled]="alunoForm.invalid">Cadastrar</button>
      </div>

    </form>

    <div class="mensagens">
      <p class="sucesso" *ngIf="mensagemSucesso">{{ mensagemSucesso }}</p>
      <p class="erro" *ngIf="mensagemErro">{{ mensagemErro }}</p>
    </div>
  </div>
</div>
